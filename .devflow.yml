stages:
  - build

steps:
  - name: Login to Docker Hub
    stage: build
    image: docker:24.0.7
    commands:
      - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

  - name: Build and push Backend Docker image
    stage: build
    image: docker:24.0.7
    commands:
      - docker build -t "$DOCKERHUB_USERNAME/fastapi-backend:latest" -f ./backend/Dockerfile ./backend
      - docker push "$DOCKERHUB_USERNAME/fastapi-backend:latest"

  - name: Build and push Frontend Docker image
    stage: build
    image: docker:24.0.7
    commands:
      - docker build -t "$DOCKERHUB_USERNAME/frontend-app:latest" -f ./frontend/Dockerfile ./frontend
      - docker push "$DOCKERHUB_USERNAME/frontend-app:latest"
